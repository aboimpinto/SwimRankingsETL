name: Meet delivery
on:
  push:
    branches: [main, feat/desktop-incremental-delivery]
  pull_request:
    paths:
      - scripts/club_export_rankings.py
      - tests/test_club_export_delivery.py
      - scripts/club_rankings.py
      - scripts/import_live_swimrankings_meet.py
      - scripts/import_live_swimrankings_month.py
      - tests/test_club_rankings_delivery.py
      - scripts/club_record_baselines.py
      - scripts/collect_club_records.py
      - tests/test_club_record_delivery.py
      - scripts/meet_delivery.py
      - scripts/publish_delivery.py
      - scripts/delivery_summaries.py
      - scripts/delivery_summary_schema.sql
      - requirements-delivery.txt
      - tests/test_meet_delivery.py
      - tests/test_delivery_publication.py
      - tests/fixtures/delivery_schema.sql
      - .github/workflows/meet-delivery.yml
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: delivery_test
          POSTGRES_DB: swimrankings_delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-delivery.txt
      - name: Create isolated test configuration
        run: |
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'delivery-test.json'
          p.write_text(json.dumps(dict(host='127.0.0.1',port=5432,dbname='swimrankings_delivery_test',user='delivery_test',password='delivery_test')))
          p.chmod(0o600)
          PY
      - name: Validate packages and PostgreSQL transactions
        env:
          DELIVERY_TEST_CONFIG: ${{ runner.temp }}/delivery-test.json
        run: python -m unittest discover -s tests -p 'test_*delivery*.py' -v
